name: Check launch-script requirements

# Verifies that the committed launch-script requirements (``*.txt``) are
# consistent with their ``*.in`` sources and ``*.override`` pins. If one of them
# (or an obi-one dependency) changed without regenerating the ``.txt``, this
# check fails. Run ``make compile-launch-deps`` locally and commit the result to
# fix it.
#
# Also called by release-pin.yml on the release tag before pinning, since the
# release fixes that commit's closure.

on:
  pull_request:
    paths:
      - "launch_scripts/**/dependencies/*.in"
      - "launch_scripts/**/dependencies/*.override"
      - "launch_scripts/**/dependencies/*.txt"
      - "launch_scripts/tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check-launch-deps.yml"
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check (defaults to the triggering ref)"
        required: false
        type: string
        default: ""

jobs:
  check-launch-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          enable-cache: true
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_codeartifact_read_all
          aws-region: us-east-1
      - name: Get CodeArtifact token
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain openbraininstitute \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          echo "UV_INDEX_OBI_CODEARTIFACT_PASSWORD=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
          echo "UV_INDEX_OBI_CODEARTIFACT_USERNAME=aws" >> $GITHUB_ENV
      - name: Install project (needed to resolve obi-one from the local checkout)
        run: make install
      - name: Check launch-script frozen requirements are up to date
        run: make check-launch-deps
