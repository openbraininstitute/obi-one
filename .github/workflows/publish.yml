name: Build and publish the Docker image

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Standard permission for GitHub Actions
  actions: write # Required for buildx GHA cache

# Dispatched by release-pin.yml on the release tag, once the tag points at the
# commit that pins obi-one for launch jobs. Can also be run manually on a release tag.
on:
  workflow_dispatch:

jobs:
  publish-to-aws-ecr:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: prod

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Check the release tag pins obi-one
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on a release tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          python3 launch_scripts/tools/launch_deps_pin.py --check --version "$GITHUB_REF_NAME"

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions runtime for Buildx GHA cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Authenticate with AWS ECR account for pushing the image
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_ecr_push_obi-one-private
          aws-region: us-east-1

      - name: Authenticate with AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build, tag and push container
        env:
          IMAGE_NAME: ${{ steps.login-ecr.outputs.registry }}/obi-one
          CACHE_FROM: type=gha,scope=obi-one
          CACHE_TO: type=gha,mode=max,scope=obi-one
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |-
          make publish
