name: Build and publish the Docker image

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Standard permission for GitHub Actions

# Dispatched by release-pin.yml on the release tag, once the tag points at the
# commit that pins obi-one for launch jobs. Can also be run manually on a release tag.
on:
  workflow_dispatch:

jobs:
  publish-to-aws-ecr:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: prod

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Check the release tag pins obi-one
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on a release tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          python3 launch_scripts/tools/launch_deps_pin.py --check --version "$GITHUB_REF_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate with AWS ECR account for pushing the image
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_ecr_push_obi-one-private
          aws-region: us-east-1

      - name: Authenticate with AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Export image env
        env:
          IMAGE_NAME: ${{ steps.login-ecr.outputs.registry }}/obi-one
        run: make image-env >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_ALIAS }}
          build-args: |
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            APP_NAME=${{ env.APP_NAME }}
            APP_VERSION=${{ env.APP_VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false
          sbom: false
