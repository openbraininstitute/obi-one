name: PyPI

# Dispatched by release-pin.yml on the release tag, once the tag points at the
# commit that pins obi-one for launch jobs. Can also be run manually on a release tag.
on:
  workflow_dispatch:

jobs:

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the release tag pins obi-one
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on a release tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          python3 launch_scripts/tools/launch_deps_pin.py --check --version "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist

  upload:
    name: Upload sdist and wheel
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1