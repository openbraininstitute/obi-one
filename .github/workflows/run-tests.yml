name: Run tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard-validators:
    # Block UI-element validators live in tests/ui_schema/validators/ and are locked: configs
    # must be fixed to match the spec, not the validators weakened to admit a bad config. A PR
    # may only change them when it carries the 'change-validators' label (a conscious, reviewed
    # decision). Direct pushes to main are not gated here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block edits to locked UI-element validators
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'change-validators') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'tests/ui_schema/validators/')
          if [ -n "$CHANGED" ]; then
            echo "::error::UI-element validators are locked. These files may not change in a PR:"
            echo "$CHANGED"
            echo "Fix your config to match the spec these validators enforce. If the spec itself"
            echo "must change, add the 'change-validators' label so a reviewer signs off."
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"
          enable-cache: true
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_codeartifact_read_all
          aws-region: us-east-1
      - name: Get CodeArtifact token
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain openbraininstitute \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          echo "UV_INDEX_OBI_CODEARTIFACT_PASSWORD=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
          echo "UV_INDEX_OBI_CODEARTIFACT_USERNAME=aws" >> $GITHUB_ENV
          echo "CODEARTIFACT_TOKEN=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
      - name: Check requirements
        run: make check-deps
      - name: Install mandatory and optional requirements
        run: make install-all
      - name: Run linters
        run: make lint
      - name: Run tests
        run: make test-docker
      - name: Run pip-audit
        run: make pip-audit
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: openbraininstitute/obi-one
          fail_ci_if_error: false
          files: .coverage/coverage.xml
          flags: pytest
          verbose: true
      - name: Cleanup
        if: ${{ always() }}
        run: |
          make destroy
