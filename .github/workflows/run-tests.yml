name: Run tests

on:
  pull_request:
    # `labeled`/`unlabeled` are included so toggling the `change-validators` label re-runs CI
    # with the updated label set (the guard-validators job reads the label from the event).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

jobs:
  guard-validators:
    # UI-element validators live under tests/ui_schema/validators/ (block elements) and
    # tests/ui_schema/validators/root/ (root elements). They are locked: configs must be fixed
    # to match the spec, not the validators weakened to admit a bad config.
    #
    # Policy: adding NEW validator files is allowed (that is how new UI elements are added).
    # Modifying or deleting an EXISTING validator file is blocked, since that is how a validator
    # gets weakened or removed. The registry.py / __init__.py wiring files are exempt because
    # registering a new validator requires editing them (they are covered by CODEOWNERS review).
    # A PR may still change locked files when it carries the 'change-validators' label. Direct
    # pushes to main are not gated here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Block edits to existing UI-element validators
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'change-validators') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Modified (M) or deleted (D) files under validators/ are violations: existing
          # validators must not be weakened or removed. Added (A) files are allowed so new
          # validators can be introduced. registry.py / __init__.py (block and root) are exempt
          # because registering a new validator requires editing them. Three-dot compares
          # against the merge-base so only files this PR changed are counted.
          VIOLATIONS=$(git diff --name-status --diff-filter=MD "$BASE_SHA"..."$HEAD_SHA" \
            -- 'tests/ui_schema/validators/' \
            ':(exclude)tests/ui_schema/validators/registry.py' \
            ':(exclude)tests/ui_schema/validators/__init__.py' \
            ':(exclude)tests/ui_schema/validators/root/__init__.py' \
            | awk '{print $2}')
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Existing UI-element validators are locked (no edits or deletes):"
            echo "$VIOLATIONS"
            echo "Add a NEW validator file instead of changing an existing one. To change the"
            echo "spec an existing validator enforces, add the 'change-validators' label."
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"
          enable-cache: true
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_codeartifact_read_all
          aws-region: us-east-1
      - name: Get CodeArtifact token
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain openbraininstitute \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          echo "UV_INDEX_OBI_CODEARTIFACT_PASSWORD=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
          echo "UV_INDEX_OBI_CODEARTIFACT_USERNAME=aws" >> $GITHUB_ENV
          echo "CODEARTIFACT_TOKEN=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
      - name: Check requirements
        run: make check-deps
      - name: Install mandatory and optional requirements
        run: make install-all
      - name: Run linters
        run: make lint
      - name: Run tests
        run: make test-docker
      - name: Run pip-audit
        run: make pip-audit
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: openbraininstitute/obi-one
          fail_ci_if_error: false
          files: .coverage/coverage.xml
          flags: pytest
          verbose: true
      - name: Cleanup
        if: ${{ always() }}
        run: |
          make destroy
