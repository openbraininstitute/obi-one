coverage:
  status:
    project:
      default:
        target: auto
        flags:
          - library
          - service
      library:
        target: auto
        flags:
          - library
      service:
        target: auto
        flags:
          - service
    patch:
      default:
        target: auto
      library:
        target: auto
        flags:
          - library
      service:
        target: auto
        flags:
          - service

flag_management:
  individual_flags:
    - name: library
      paths:
        - obi_one/
      carryforward: false
    - name: service
      paths:
        - app/
      carryforward: false

comment:
  layout: "header,diff,flags,files"
  behavior: default
  require_changes: false
